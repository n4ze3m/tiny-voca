<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tiny-voca | محادثة صوتية عربية</title>
<style>
  :root { --blue:#2257b3; --bg:#f4f6fa; --user:#dce8ff; --bot:#fff; --line:#dfe3ea; }
  * { box-sizing: border-box; }
  body { font-family: Tahoma, "Segoe UI", Arial, sans-serif; margin:0; background:var(--bg); color:#1d2433; }
  header { background:var(--blue); color:white; padding:1rem 1.2rem; }
  header h1 { margin:0; font-size:1.2rem; }
  header p { margin:.35rem 0 0; font-size:.85rem; opacity:.9; }
  main { max-width:760px; margin:0 auto; padding:1rem; }
  #chat { display:flex; flex-direction:column; gap:.8rem; min-height:55vh; }
  .msg { max-width:82%; padding:.75rem 1rem; border-radius:14px; line-height:1.8; box-shadow:0 1px 4px #0001; }
  .user { align-self:flex-end; background:var(--user); border-bottom-left-radius:3px; }
  .bot { align-self:flex-start; width:min(100%, 560px); background:var(--bot); border:1px solid var(--line); border-bottom-right-radius:3px; }
  .error { align-self:center; background:#ffe6e6; color:#8a1f1f; }
  .typing { align-self:flex-start; color:#666; font-size:.9rem; }
  .label { font-size:.72rem; color:#777; margin-bottom:.25rem; }
  /* Keep the answer text in the DOM (history/debug) but show voice only. */
  .bot .text { display: none; }
  .hidden-answer { display: none; }
  audio { display:block; width:100%; margin-top:.8rem; height:54px; }
  .meta { font-size:.75rem; color:#666; margin-top:.35rem; direction:ltr; text-align:right; }
  .spinner { display:inline-block; width:.8em; height:.8em; border:2px solid #c7d2e6;
             border-top-color:var(--blue); border-radius:50%; margin-inline-end:.4rem;
             vertical-align:-1px; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (max-width:600px) { .bot { width:100%; } #composer { flex-wrap:wrap; } }
  #composer { display:flex; gap:.6rem; position:sticky; bottom:0; background:var(--bg); padding:.8rem 0 1.2rem; }
  #question { flex:1; padding:.8rem 1rem; font-size:1rem; border:1px solid var(--line); border-radius:10px; }
  button { padding:.7rem 1.1rem; border:0; border-radius:10px; cursor:pointer; font-size:.95rem; }
  #send { background:var(--blue); color:white; }
  #regen, #clear { background:#e6e9ef; color:#333; }
  #stop { background:#ffd9d9; color:#8a1f1f; }
  button:disabled { opacity:.55; cursor:default; }
  footer { text-align:center; color:#777; font-size:.75rem; padding:1rem; line-height:1.7; }
</style>
</head>
<body>
<header>
  <h1>تحدث مع مساعدك الصوتي</h1>
  <p>اكتب سؤالك بالعربية، وستصلك الإجابة صوتية فقط. ابدأ محادثة جديدة.</p>
</header>
<main>
  <div id="chat" aria-live="polite"></div>
  <div id="composer">
    <input id="question" autocomplete="off" placeholder="اكتب سؤالك هنا..."
           value="كيف حالك اليوم؟">
    <button id="send" onclick="send()">أرسل</button>
    <button id="regen" onclick="regenerate()" disabled>إعادة</button>
    <button id="stop" onclick="stopStream()" disabled>إيقاف</button>
    <button id="clear" onclick="clearChat()">جديد</button>
  </div>
</main>
<footer>
  الصوت من نموذج tiny-voca العربي، مبني على Arabic Speech Corpus (Halabi 2016)، CC BY 4.0.<br>
  Halabi, Nawar (2016). Modern standard Arabic phonetics for speech synthesis. PhD thesis, University of Southampton.
</footer>
<script>
const chat = document.getElementById("chat");
const input = document.getElementById("question");
const sendButton = document.getElementById("send");
const regenButton = document.getElementById("regen");
const stopButton = document.getElementById("stop");
let history = [];
let busy = false;
let controller = null;
let audioQueue = [];
let playingAudio = false;
let activeAudio = null;

function bubble(kind, html) {
  const div = document.createElement("div");
  div.className = "msg " + kind;
  div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function escapeHtml(text) {
  const node = document.createElement("span");
  node.textContent = text;
  return node.innerHTML;
}

function addUser(text) {
  bubble("user", '<div class="label">سؤالك</div>' + escapeHtml(text));
}

function formatTime(seconds) {
  if (!isFinite(seconds) || seconds < 0) return "0:00";
  const minutes = Math.floor(seconds / 60);
  return minutes + ":" + String(Math.floor(seconds % 60)).padStart(2, "0");
}

function base64ToBlob(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let index = 0; index < binary.length; index++) bytes[index] = binary.charCodeAt(index);
  return new Blob([bytes], { type: "audio/wav" });
}

// Parts arrive one after another: play them in order instead of overlapping.
function playNextAudio() {
  if (playingAudio || audioQueue.length === 0) return;
  const next = audioQueue.shift();
  activeAudio = next;
  playingAudio = true;
  next.play().catch(() => { playingAudio = false; });   // controls stay available
}

function addBot(text, blob) {
  const div = bubble("bot", '<div class="label">رسالة صوتية</div><div class="text">' +
                     escapeHtml(text) + "</div>");
  const audio = document.createElement("audio");
  audio.controls = true;
  audio.preload = "auto";
  audio.src = URL.createObjectURL(blob);
  div.appendChild(audio);
  // Explicit elapsed / total time so playback progress is always visible.
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = "0:00 / 0:00";
  div.appendChild(meta);
  const updateProgress = () => {
    meta.textContent = formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
  };
  audio.addEventListener("loadedmetadata", updateProgress);
  audio.addEventListener("timeupdate", updateProgress);
  audio.addEventListener("ended", () => {
    updateProgress();
    if (activeAudio === audio) { playingAudio = false; activeAudio = null; }
    playNextAudio();
  });
  audio.addEventListener("play", () => {
    if (activeAudio && activeAudio !== audio) activeAudio.pause();
    activeAudio = audio;
    playingAudio = true;
  });
  updateProgress();
  audioQueue.push(audio);
  playNextAudio();
  return audio;
}

function clearAudioQueue() {
  audioQueue.forEach((audio) => audio.pause());
  audioQueue = [];
  if (activeAudio) activeAudio.pause();
  activeAudio = null;
  playingAudio = false;
}

function recordAnswer(question, answer) {
  // The text implementation is kept: hidden in the DOM and sent back as
  // assistant context, but never displayed (voice-only user experience).
  const hidden = document.createElement("div");
  hidden.className = "hidden-answer";
  hidden.textContent = answer;
  chat.appendChild(hidden);
  history.push({ role: "user", content: question },
               { role: "assistant", content: answer });
  if (history.length > 12) history = history.slice(-12);
}

async function answerStream(question, waiting, status, signal) {
  const response = await fetch("/api/voice/answer/stream", {
    method: "POST",
    signal: signal,
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question: question, history: history })
  });
  if (!response.ok) {
    let detail = "HTTP " + response.status;
    try { detail = (await response.json()).detail || detail; } catch (error) {}
    throw new Error(detail);
  }
  const reader = response.body.getReader();
  const decoder = new TextDecoder("utf-8");
  let buffer = "";
  let full = "";
  while (true) {
    const chunk = await reader.read();
    if (chunk.done) break;
    buffer += decoder.decode(chunk.value, { stream: true });
    let newline;
    while ((newline = buffer.indexOf("\n")) >= 0) {
      const line = buffer.slice(0, newline).trim();
      buffer = buffer.slice(newline + 1);
      if (!line) continue;
      const event = JSON.parse(line);
      if (event.error) throw new Error(event.error);
      if (event.part) {
        status.textContent = "جارٍ إعداد الجواب الصوتي... (" + event.part + "/" +
                             (event.parts || "…") + ")";
        addBot(event.text || "", base64ToBlob(event.audio));
      }
      if (event.done) full = event.text || full;
    }
  }
  waiting.remove();
  recordAnswer(question, full);
}

async function answerWhole(question) {
  // Fallback for browsers without a readable response body: the original
  // endpoint and its X-Answer-Text header remain part of the implementation.
  const response = await fetch("/api/voice/answer", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question: question, history: history })
  });
  if (!response.ok) {
    let detail = "HTTP " + response.status;
    try { detail = (await response.json()).detail || detail; } catch (error) {}
    throw new Error(detail);
  }
  const answer = decodeURIComponent(response.headers.get("X-Answer-Text") || "");
  addBot(answer, await response.blob());
  recordAnswer(question, answer);
}

async function send(questionOverride) {
  if (busy) return;
  const question = (questionOverride || input.value).trim();
  if (!question) return;
  busy = true;
  sendButton.disabled = true;
  regenButton.disabled = true;
  stopButton.disabled = false;
  input.value = "";
  addUser(question);
  const waiting = bubble("typing", '<span class="spinner"></span>' +
                         '<span id="status">جارٍ إعداد الجواب الصوتي... (0)</span>');
  const status = waiting.querySelector("#status");
  controller = new AbortController();
  try {
    if (typeof Response.prototype.body === "undefined" || typeof TextDecoder === "undefined") {
      await answerWhole(question);
    } else {
      await answerStream(question, waiting, status, controller.signal);
    }
    waiting.remove();
  } catch (error) {
    clearAudioQueue();
    waiting.remove();
    if (error.name === "AbortError") bubble("typing", "تم إيقاف الإجابة.");
    else bubble("error", "حدث خطأ: " + escapeHtml(error.message));
  } finally {
    busy = false;
    controller = null;
    sendButton.disabled = false;
    regenButton.disabled = history.length < 2;
    stopButton.disabled = true;
    input.focus();
  }
}

function stopStream() {
  if (!busy || !controller) return;
  controller.abort();                 // stops the NDJSON reader
  clearAudioQueue();                  // stops any queued audio parts
}

function regenerate() {
  if (busy || history.length < 2) return;
  const previous = history[history.length - 2];
  if (!previous || previous.role !== "user") return;
  history = history.slice(0, -2);     // re-ask without the old answer in context
  send(previous.content);
}

function clearChat() {
  if (controller) controller.abort();
  clearAudioQueue();
  chat.innerHTML = "";
  history = [];
  regenButton.disabled = true;
  input.focus();
}

input.addEventListener("keydown", (event) => {
  if (event.key === "Enter") { event.preventDefault(); send(); }
});
input.focus();
</script>
</body>
</html>
